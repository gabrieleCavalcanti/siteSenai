            <form class="form" action="/enviar" method="post">

                <div class="nomeEmail">
                    <div class="form_grupo">
                        <label class="label" for="nome">Nome:</label><br>
                        <input class="input" type="text" id="nome" name="nome" required>
                    </div>
                    <br> <br>
                    <div class="form_grupo">
                        <label class="label" for="email">E-mail:</label><br>
                        <input class="input" type="text" id="email" name="email" required>
                    </div>
                </div><br>
                <label class="label" for="telefone">Telefone:</label><br>
                <input class="inputTel" type="tel" id="telefone" name="telefone" required><br><br>

                <label class="label" for="mensagem">Mensagem:</label><br><br>
                <textarea id="mensagem" name="mensagem"></textarea><br><br>

                <input class="enviar" type="submit" value="Enviar">
            </form>
        </div>


    </main>
